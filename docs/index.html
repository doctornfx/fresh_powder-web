<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fresh Powder - Web Demo</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Loading screen */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
            color: white;
            font-family: 'Space Mono', monospace;
            z-index: 1000;
        }

        #loading.hidden {
            display: none;
        }

        .loading-title {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #9933D9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Canvas container for responsive scaling */
        #canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* Canvas styling - responsive sizing */
        canvas {
            display: block;
            max-width: calc(100vw - 10px);
            max-height: calc(100vh - 10px);
            width: 880px;
            height: 550px;
            border: 1px solid #333;
            object-fit: contain;
        }
    </style>
    
<script type="module" nonce="X0J9p3daNnu0n8WQz/cLNw==">
import init, * as bindings from '/fresh_powder-web/fresh-powder-web-demo-739b55bf31f48529.js';
const wasm = await init({ module_or_path: '/fresh_powder-web/fresh-powder-web-demo-739b55bf31f48529_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    
<link rel="modulepreload" href="/fresh_powder-web/fresh-powder-web-demo-739b55bf31f48529.js" crossorigin=anonymous integrity="sha384-9awWWVlhIwydy0lOpqZeasnCpRMgSblaZSW7qkI7Wf50JHNWx9gmUoMz1zteqzZA"><link rel="preload" href="/fresh_powder-web/fresh-powder-web-demo-739b55bf31f48529_bg.wasm" crossorigin=anonymous integrity="sha384-v5N651uxFDp4Z+kTL3RBgM2MOYpqB5uyDIkANCaTpRQtJJlin/xwBOWHkX4dZ4ge" as="fetch" type="application/wasm"></head>
<body>
    <div id="loading">
        <div class="loading-title">fresh__powder__</div>
        <div class="loading-spinner"></div>
        <div style="margin-top: 20px; color: #666;">Loading WASM...</div>
    </div>

    <!-- Canvas container for responsive scaling -->
    <div id="canvas-container">
        <canvas id="the_canvas_id"></canvas>
    </div>

    <script>
    (function() {
        const CANVAS_WIDTH = 880;
        const CANVAS_HEIGHT = 550;
        const ASPECT_RATIO = CANVAS_WIDTH / CANVAS_HEIGHT;
        const PADDING = 20;

        function updateScale() {
            const canvas = document.getElementById('the_canvas_id');
            if (!canvas) return;

            const availableWidth = window.innerWidth - (PADDING * 2);
            const availableHeight = window.innerHeight - (PADDING * 2);

            // Only scale down, never up (desktop stays at 1.0)
            if (availableWidth >= CANVAS_WIDTH && availableHeight >= CANVAS_HEIGHT) {
                canvas.style.width = CANVAS_WIDTH + 'px';
                canvas.style.height = CANVAS_HEIGHT + 'px';
                return;
            }

            // Calculate size maintaining aspect ratio
            let newWidth, newHeight;
            if (availableWidth / availableHeight > ASPECT_RATIO) {
                // Height is the limiting factor
                newHeight = availableHeight;
                newWidth = newHeight * ASPECT_RATIO;
            } else {
                // Width is the limiting factor
                newWidth = availableWidth;
                newHeight = newWidth / ASPECT_RATIO;
            }

            canvas.style.width = newWidth + 'px';
            canvas.style.height = newHeight + 'px';
        }

        window.addEventListener('load', updateScale);
        window.addEventListener('resize', updateScale);
        window.addEventListener('orientationchange', function() {
            setTimeout(updateScale, 100);
        });
    })();
    </script>
</body>
</html>
