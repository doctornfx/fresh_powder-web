<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fresh Powder - Web Demo</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Loading screen */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
            color: white;
            font-family: 'Space Mono', monospace;
            z-index: 1000;
        }

        #loading.hidden {
            display: none;
        }

        .loading-title {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #9933D9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Canvas container - sized to match scaled canvas for proper hit testing */
        #canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* Wrapper that gets sized to the scaled dimensions */
        #canvas-wrapper {
            position: relative;
            width: 880px;
            height: 550px;
            overflow: hidden;
        }

        /* Canvas renders at full size, scaled via transform */
        canvas {
            display: block;
            width: 880px;
            height: 550px;
            border: 1px solid #333;
            transform-origin: top left;
        }
    </style>
    
<script type="module" nonce="njKhpX/46rzeUff95iNYSg==">
import init, * as bindings from '/fresh_powder-web/fresh-powder-web-demo-739b55bf31f48529.js';
const wasm = await init({ module_or_path: '/fresh_powder-web/fresh-powder-web-demo-739b55bf31f48529_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>

<body>
    <div id="loading">
        <div class="loading-title">fresh__powder__</div>
        <div class="loading-spinner"></div>
        <div style="margin-top: 20px; color: #666;">Loading WASM...</div>
    </div>

    <!-- Canvas container for responsive scaling -->
    <div id="canvas-container">
        <div id="canvas-wrapper">
            <canvas id="the_canvas_id"></canvas>
        </div>
    </div>

    <script>
    (function() {
        const CANVAS_WIDTH = 880;
        const CANVAS_HEIGHT = 550;
        const PADDING = 10;
        let currentScale = 1.0;

        function updateScale() {
            const canvas = document.getElementById('the_canvas_id');
            const wrapper = document.getElementById('canvas-wrapper');
            if (!canvas || !wrapper) return;

            const availableWidth = window.innerWidth - (PADDING * 2);
            const availableHeight = window.innerHeight - (PADDING * 2);

            // Calculate scale factor (only scale down, never up)
            currentScale = 1.0;
            if (availableWidth < CANVAS_WIDTH || availableHeight < CANVAS_HEIGHT) {
                const scaleX = availableWidth / CANVAS_WIDTH;
                const scaleY = availableHeight / CANVAS_HEIGHT;
                currentScale = Math.min(scaleX, scaleY, 1.0);
            }

            // Apply transform to canvas
            canvas.style.transform = `scale(${currentScale})`;

            // Resize wrapper to match scaled dimensions (for proper layout)
            wrapper.style.width = (CANVAS_WIDTH * currentScale) + 'px';
            wrapper.style.height = (CANVAS_HEIGHT * currentScale) + 'px';
        }

        // Intercept touch/pointer events and adjust coordinates for the scale transform
        function setupPointerInterception() {
            const canvas = document.getElementById('the_canvas_id');
            if (!canvas) return;

            // Create a proxy event with adjusted coordinates
            function createScaledEvent(originalEvent, type) {
                const rect = canvas.getBoundingClientRect();
                const touches = originalEvent.touches || originalEvent.changedTouches;

                if (touches) {
                    // Touch event - create new TouchEvent with scaled coordinates
                    const scaledTouches = Array.from(touches).map(touch => {
                        const x = (touch.clientX - rect.left) / currentScale;
                        const y = (touch.clientY - rect.top) / currentScale;
                        return new Touch({
                            identifier: touch.identifier,
                            target: canvas,
                            clientX: rect.left + x,
                            clientY: rect.top + y,
                            pageX: touch.pageX - (touch.clientX - rect.left) + x,
                            pageY: touch.pageY - (touch.clientY - rect.top) + y,
                            screenX: touch.screenX,
                            screenY: touch.screenY,
                        });
                    });

                    return new TouchEvent(type, {
                        bubbles: true,
                        cancelable: true,
                        touches: type === 'touchend' ? [] : scaledTouches,
                        targetTouches: type === 'touchend' ? [] : scaledTouches,
                        changedTouches: scaledTouches,
                    });
                }
                return null;
            }

            // Overlay to capture events before they reach the scaled canvas
            const overlay = document.createElement('div');
            overlay.style.cssText = `
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                touch-action: none;
            `;

            const wrapper = document.getElementById('canvas-wrapper');
            wrapper.style.position = 'relative';
            wrapper.appendChild(overlay);

            ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(eventType => {
                overlay.addEventListener(eventType, (e) => {
                    e.preventDefault();
                    e.stopPropagation();

                    const scaledEvent = createScaledEvent(e, eventType);
                    if (scaledEvent) {
                        canvas.dispatchEvent(scaledEvent);
                    }
                }, { passive: false });
            });

            // Also handle mouse events for testing in desktop dev tools
            ['mousedown', 'mousemove', 'mouseup'].forEach(eventType => {
                overlay.addEventListener(eventType, (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / currentScale;
                    const y = (e.clientY - rect.top) / currentScale;

                    const scaledEvent = new MouseEvent(eventType, {
                        bubbles: true,
                        cancelable: true,
                        clientX: rect.left + x,
                        clientY: rect.top + y,
                        button: e.button,
                        buttons: e.buttons,
                    });
                    canvas.dispatchEvent(scaledEvent);
                });
            });
        }

        window.addEventListener('load', () => {
            updateScale();
            setupPointerInterception();
        });
        window.addEventListener('resize', updateScale);
        window.addEventListener('orientationchange', function() {
            setTimeout(updateScale, 100);
        });
    })();
    </script>
</body>
</html>
