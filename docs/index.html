<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fresh Powder - Web Demo</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Loading screen */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
            color: white;
            font-family: 'Space Mono', monospace;
            z-index: 1000;
        }

        #loading.hidden {
            display: none;
        }

        .loading-title {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #9933D9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Canvas container - sized to match scaled canvas for proper hit testing */
        #canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* Wrapper that gets sized to the scaled dimensions */
        #canvas-wrapper {
            position: relative;
            width: 880px;
            height: 550px;
            overflow: hidden;
        }

        /* Canvas renders at full size, scaled via transform */
        canvas {
            display: block;
            width: 880px;
            height: 550px;
            border: 1px solid #333;
            transform-origin: top left;
        }
    </style>
    
<script type="module" nonce="clwSJzJ2rQt26Ub0ZUOdZg==">
import init, * as bindings from '/fresh_powder-web/fresh-powder-web-demo-739b55bf31f48529.js';
const wasm = await init({ module_or_path: '/fresh_powder-web/fresh-powder-web-demo-739b55bf31f48529_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    
<link rel="modulepreload" href="/fresh_powder-web/fresh-powder-web-demo-739b55bf31f48529.js" crossorigin=anonymous integrity="sha384-i4z/PK2iriKOM13iDUQ6pcQcqvqPiiPnyz/IuoKmfzpBir4cZxvt66DQXkEfD6l/"><link rel="preload" href="/fresh_powder-web/fresh-powder-web-demo-739b55bf31f48529_bg.wasm" crossorigin=anonymous integrity="sha384-8B0Ugb+fXNNYrIu1G/88U59cLXuJn/wlgs1p4IAhuO4zrCo0t/Vn1Eo5pyk5F2Go" as="fetch" type="application/wasm"></head>
<body>
    <div id="loading">
        <div class="loading-title">fresh__powder__</div>
        <div class="loading-spinner"></div>
        <div style="margin-top: 20px; color: #666;">Loading WASM...</div>
    </div>

    <!-- Canvas container for responsive scaling -->
    <div id="canvas-container">
        <div id="canvas-wrapper">
            <canvas id="the_canvas_id"></canvas>
        </div>
    </div>

    <script>
    (function() {
        const CANVAS_WIDTH = 880;
        const CANVAS_HEIGHT = 550;
        const ASPECT_RATIO = CANVAS_WIDTH / CANVAS_HEIGHT;
        const PADDING = 10;

        function updateScale() {
            const canvas = document.getElementById('the_canvas_id');
            const wrapper = document.getElementById('canvas-wrapper');
            if (!canvas || !wrapper) return;

            const availableWidth = window.innerWidth - (PADDING * 2);
            const availableHeight = window.innerHeight - (PADDING * 2);

            // Calculate scale factor (only scale down, never up)
            let scale = 1.0;
            if (availableWidth < CANVAS_WIDTH || availableHeight < CANVAS_HEIGHT) {
                const scaleX = availableWidth / CANVAS_WIDTH;
                const scaleY = availableHeight / CANVAS_HEIGHT;
                scale = Math.min(scaleX, scaleY, 1.0);
            }

            // Apply transform to canvas
            canvas.style.transform = `scale(${scale})`;

            // Resize wrapper to match scaled dimensions (for proper layout)
            wrapper.style.width = (CANVAS_WIDTH * scale) + 'px';
            wrapper.style.height = (CANVAS_HEIGHT * scale) + 'px';
        }

        window.addEventListener('load', updateScale);
        window.addEventListener('resize', updateScale);
        window.addEventListener('orientationchange', function() {
            setTimeout(updateScale, 100);
        });
    })();
    </script>
</body>
</html>
