<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fresh Powder - Web Demo</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Loading screen */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
            color: white;
            font-family: 'Space Mono', monospace;
            z-index: 1000;
        }

        .loading-title {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #9933D9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Canvas container for centering */
        #canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* Canvas - egui handles internal scaling via pixels_per_point */
        canvas {
            display: block;
            border: 1px solid #333;
        }
    </style>
    <link data-trunk rel="rust" data-wasm-opt="2" />
    <link data-trunk rel="copy-dir" href="assets" />
</head>
<body>
    <div id="loading">
        <div class="loading-title">fresh__powder__</div>
        <div class="loading-spinner"></div>
        <div style="margin-top: 20px; color: #666;">Loading WASM...</div>
    </div>

    <!-- Canvas container for centering -->
    <div id="canvas-container">
        <canvas id="the_canvas_id"></canvas>
    </div>

    <script>
        // SPA fallback: redirect to index.html after app loads
        // This handles direct URL access to subpaths
        if (location.pathname !== '/' && !location.pathname.endsWith('.html')) {
            // Wait a bit for the app to load, then show a message or redirect
            setTimeout(function() {
                // The WASM app will handle this route, but if not loaded yet,
                // we can redirect to the root
                if (!window.wasmLoaded) {
                    window.location.href = '/';
                }
            }, 2000);
        }
    </script>
</body>
</html>
